name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests, dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ui,dev]"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Unit tests
        run: pytest tests/unit -q
      - name: Integration tests (local mocks + local demo enterprise app + headless Chromium)
        run: pytest tests/integration -q
      - name: Dependency vulnerability audit
        run: pip-audit --skip-editable --progress-spinner off

  docker:
    name: Docker build + Compose E2E
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build and start stack
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: E2E (approve + restart recovery + reject)
        env:
          E2E_BASE_URL: http://127.0.0.1:8000
          E2E_RESTART: "1"
        run: |
          pip install pytest pytest-timeout httpx
          pytest tests/e2e -m docker -q -p no:cacheprovider --rootdir tests/e2e -c /dev/null
      - name: Compose logs
        if: failure()
        run: docker compose logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose down -v
