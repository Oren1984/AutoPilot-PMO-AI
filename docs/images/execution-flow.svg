<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 520" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Hybrid execution flow through the ExecutionGateway</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="520" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#0f172a">One agent step: propose → gateway checks → API or UI → observe → checkpoint</text>

  <rect x="24" y="70" width="170" height="70" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="109" y="96" text-anchor="middle" font-weight="600" fill="#312e81">Brain proposes</text>
  <text x="109" y="116" text-anchor="middle" fill="#334155">ToolCall(action, params,</text>
  <text x="109" y="132" text-anchor="middle" fill="#334155">rationale)</text>

  <!-- gateway chain -->
  <g>
    <rect x="230" y="70" width="140" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="300" y="96" text-anchor="middle" font-weight="600" fill="#78350f">1 · Validate</text>
    <text x="300" y="116" text-anchor="middle" fill="#451a03">known capability +</text>
    <text x="300" y="132" text-anchor="middle" fill="#451a03">JSON-schema params</text>

    <rect x="395" y="70" width="140" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="465" y="96" text-anchor="middle" font-weight="600" fill="#78350f">2 · Route</text>
    <text x="465" y="116" text-anchor="middle" fill="#451a03">prefer API; UI only for</text>
    <text x="465" y="132" text-anchor="middle" fill="#451a03">UI-only actions</text>

    <rect x="560" y="70" width="140" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="630" y="96" text-anchor="middle" font-weight="600" fill="#78350f">3 · Policy</text>
    <text x="630" y="116" text-anchor="middle" fill="#451a03">level · method ·</text>
    <text x="630" y="132" text-anchor="middle" fill="#451a03">values · limits</text>

    <rect x="725" y="70" width="230" height="70" rx="8" fill="#fef3c7" stroke="#b45309"/>
    <text x="840" y="96" text-anchor="middle" font-weight="600" fill="#78350f">4 · Idempotency ledger</text>
    <text x="840" y="116" text-anchor="middle" fill="#451a03">completed write → replay result</text>
    <text x="840" y="132" text-anchor="middle" fill="#451a03">uncertain financial → never retry</text>
  </g>
  <line x1="194" y1="105" x2="226" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="370" y1="105" x2="391" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="535" y1="105" x2="556" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="700" y1="105" x2="721" y2="105" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- policy outcomes -->
  <rect x="470" y="190" width="150" height="58" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="545" y="214" text-anchor="middle" font-weight="600" fill="#7f1d1d">Level 3 · DENY</text>
  <text x="545" y="234" text-anchor="middle" fill="#450a0a">blocked, logged</text>
  <rect x="640" y="190" width="170" height="58" rx="8" fill="#ffedd5" stroke="#c2410c"/>
  <text x="725" y="214" text-anchor="middle" font-weight="600" fill="#7c2d12">Level 2 · APPROVAL</text>
  <text x="725" y="234" text-anchor="middle" fill="#431407">pause run (see flow 3)</text>
  <line x1="610" y1="140" x2="560" y2="186" stroke="#b91c1c" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="650" y1="140" x2="705" y2="186" stroke="#c2410c" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="826" y="214" fill="#15803d" font-weight="600">Level 1 · ALLOW ↓</text>

  <!-- adapters -->
  <rect x="230" y="300" width="330" height="96" rx="10" fill="#f0fdf4" stroke="#15803d"/>
  <text x="395" y="324" text-anchor="middle" font-weight="600" fill="#14532d">Method A · API (REST)</text>
  <text x="395" y="346" text-anchor="middle" fill="#334155">list/get project, tasks, milestones, purchase requests</text>
  <text x="395" y="364" text-anchor="middle" fill="#334155">update_task_status · add_task_comment</text>
  <text x="395" y="382" text-anchor="middle" fill="#334155">update_milestone_health · execute_payment (simulated)</text>

  <rect x="590" y="300" width="365" height="96" rx="10" fill="#f0fdf4" stroke="#15803d"/>
  <text x="772" y="324" text-anchor="middle" font-weight="600" fill="#14532d">Method B · UI (Playwright Chromium)</text>
  <text x="772" y="346" text-anchor="middle" fill="#334155">ui_view_project — read the rendered page</text>
  <text x="772" y="364" text-anchor="middle" fill="#334155">ui_submit_status_report — fill + submit the form</text>
  <text x="772" y="382" text-anchor="middle" fill="#334155">screenshots stored per step (no credentials shown)</text>
  <line x1="840" y1="140" x2="420" y2="296" stroke="#15803d" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="880" y1="140" x2="790" y2="296" stroke="#15803d" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- observe -->
  <rect x="24" y="300" width="170" height="96" rx="8" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="109" y="324" text-anchor="middle" font-weight="600" fill="#312e81">Brain observes</text>
  <text x="109" y="346" text-anchor="middle" fill="#334155">result wrapped as</text>
  <text x="109" y="364" text-anchor="middle" fill="#334155">UNTRUSTED data;</text>
  <text x="109" y="382" text-anchor="middle" fill="#334155">plan is updated</text>
  <line x1="230" y1="348" x2="198" y2="348" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <rect x="24" y="430" width="931" height="62" rx="8" fill="#ecfeff" stroke="#0e7490"/>
  <text x="489" y="455" text-anchor="middle" font-weight="600" fill="#164e63">Every step: TOOL_CALL event (method, result, policy, duration) + durable checkpoint (brain state, usage, plan) in SQLite</text>
  <text x="489" y="476" text-anchor="middle" fill="#334155">Limits checked each step: max steps · max tool calls · max model calls · cost ceiling · run timeout → BLOCKED with explanation</text>
  <line x1="109" y1="396" x2="109" y2="426" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M40,430 C10,300 10,180 24,140" fill="none" stroke="#475569" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <text x="30" y="275" fill="#475569" font-size="12" transform="rotate(-90 30 275)">next step</text>
</svg>
