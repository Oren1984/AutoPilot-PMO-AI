<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>AutoPilot PMO AI - system architecture</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="600" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#0f172a">AutoPilot PMO AI — architecture (one Compose project, three containers)</text>

  <!-- operator -->
  <rect x="24" y="70" width="150" height="56" rx="8" fill="#f1f5f9" stroke="#64748b"/>
  <text x="99" y="95" text-anchor="middle" font-weight="600" fill="#0f172a">Operator</text>
  <text x="99" y="113" text-anchor="middle" fill="#334155">browser</text>

  <!-- ui container -->
  <rect x="220" y="56" width="230" height="84" rx="10" fill="#eef2ff" stroke="#4f46e5"/>
  <text x="335" y="80" text-anchor="middle" font-weight="600" fill="#312e81">ui  ·  Streamlit console :8501</text>
  <text x="335" y="100" text-anchor="middle" fill="#334155">operations · approvals · timeline</text>
  <text x="335" y="118" text-anchor="middle" fill="#334155">diagnostics · Help Center</text>

  <!-- backend container -->
  <rect x="220" y="170" width="520" height="380" rx="12" fill="#f8fafc" stroke="#0f766e" stroke-width="1.5"/>
  <text x="236" y="194" font-weight="600" fill="#115e59">backend  ·  FastAPI :8000  (agent runtime + headless Chromium)</text>

  <rect x="240" y="210" width="220" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="350" y="234" text-anchor="middle" font-weight="600" fill="#0f172a">AgentRuntime</text>
  <text x="350" y="254" text-anchor="middle" fill="#334155">state machine · checkpoints · limits</text>

  <rect x="500" y="210" width="220" height="62" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="610" y="230" text-anchor="middle" font-weight="600" fill="#0f172a">Agent brain (one of)</text>
  <text x="610" y="248" text-anchor="middle" fill="#334155">SimulatedAgent (demo, rule-based)</text>
  <text x="610" y="264" text-anchor="middle" fill="#334155">ClaudeAgent (Anthropic SDK)</text>

  <rect x="240" y="300" width="480" height="86" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="480" y="324" text-anchor="middle" font-weight="600" fill="#78350f">ExecutionGateway — the single execution boundary</text>
  <text x="480" y="344" text-anchor="middle" fill="#451a03">validate → route API/UI → PolicyEngine (JSON, read-only) →</text>
  <text x="480" y="362" text-anchor="middle" fill="#451a03">ApprovalManager (hash-bound, TTL, re-validation) → idempotency ledger</text>

  <rect x="240" y="412" width="225" height="58" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="352" y="436" text-anchor="middle" font-weight="600" fill="#0f172a">Method A · API adapters</text>
  <text x="352" y="455" text-anchor="middle" fill="#334155">DemoApiAdapter · SalesforceAdapter</text>

  <rect x="495" y="412" width="225" height="58" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <text x="607" y="436" text-anchor="middle" font-weight="600" fill="#0f172a">Method B · UI adapter</text>
  <text x="607" y="455" text-anchor="middle" fill="#334155">Playwright Chromium + screenshots</text>

  <rect x="240" y="488" width="480" height="46" rx="8" fill="#ecfeff" stroke="#0e7490"/>
  <text x="480" y="508" text-anchor="middle" font-weight="600" fill="#164e63">SQLite /data/agent.db (volume agent-data)</text>
  <text x="480" y="525" text-anchor="middle" fill="#334155">runs · events · approvals · executions · checkpoints · usage</text>

  <!-- enterprise -->
  <rect x="780" y="300" width="180" height="170" rx="12" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
  <text x="870" y="326" text-anchor="middle" font-weight="600" fill="#14532d">enterprise :8100</text>
  <text x="870" y="346" text-anchor="middle" fill="#334155">DemoCorp (simulated)</text>
  <text x="870" y="372" text-anchor="middle" fill="#334155">REST API  /api/*</text>
  <text x="870" y="392" text-anchor="middle" fill="#334155">Web UI  (HTML forms)</text>
  <text x="870" y="418" text-anchor="middle" fill="#334155">SQLite enterprise.db</text>
  <text x="870" y="438" text-anchor="middle" fill="#334155">projects · tasks · PRs</text>

  <rect x="780" y="190" width="180" height="80" rx="10" fill="#ffffff" stroke="#64748b" stroke-dasharray="5 4"/>
  <text x="870" y="214" text-anchor="middle" font-weight="600" fill="#0f172a">Connected Mode only</text>
  <text x="870" y="234" text-anchor="middle" fill="#334155">Anthropic Messages API</text>
  <text x="870" y="254" text-anchor="middle" fill="#334155">Salesforce REST (OAuth CC)</text>

  <!-- arrows -->
  <line x1="174" y1="98" x2="216" y2="98" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="335" y1="140" x2="335" y2="206" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="342" y="168" fill="#475569" font-size="12">HTTP (polling)</text>
  <line x1="460" y1="241" x2="496" y2="241" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="350" y1="272" x2="350" y2="296" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="352" y1="386" x2="352" y2="408" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="607" y1="386" x2="607" y2="408" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <path d="M465,441 C640,500 740,420 776,410" fill="none" stroke="#15803d" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="720" y1="441" x2="776" y2="441" stroke="#15803d" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="720" y1="241" x2="776" y2="235" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>
  <line x1="450" y1="70" x2="776" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="776" y1="70" x2="870" y2="70" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="870" y1="70" x2="870" y2="296" stroke="#94a3b8" stroke-width="1" stroke-dasharray="3 3" marker-end="url(#a)"/>
  <text x="560" y="62" fill="#475569" font-size="12">records view + demo reset (admin token)</text>

  <text x="24" y="584" fill="#64748b" font-size="12">All ports bind to 127.0.0.1. Containers: non-root user, cap_drop ALL, no-new-privileges, memory/CPU limits, health checks.   Developed and Built by Oren Salami — V1.0</text>
</svg>
