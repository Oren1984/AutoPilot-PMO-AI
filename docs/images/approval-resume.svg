<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 540" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13">
  <title>Human approval and resume flow</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="980" height="540" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="600" fill="#0f172a">Financial gate: pause → explicit human decision → re-validate → execute once</text>

  <!-- row 1 run states -->
  <g font-weight="600">
    <rect x="24" y="66" width="120" height="44" rx="22" fill="#dbeafe" stroke="#1d4ed8"/><text x="84" y="93" text-anchor="middle" fill="#1e3a8a">RUNNING</text>
    <rect x="200" y="66" width="190" height="44" rx="22" fill="#ffedd5" stroke="#c2410c"/><text x="295" y="93" text-anchor="middle" fill="#7c2d12">WAITING_APPROVAL</text>
    <rect x="450" y="66" width="130" height="44" rx="22" fill="#e0e7ff" stroke="#4338ca"/><text x="515" y="93" text-anchor="middle" fill="#312e81">RESUMING</text>
    <rect x="640" y="66" width="130" height="44" rx="22" fill="#e0f2fe" stroke="#0369a1"/><text x="705" y="93" text-anchor="middle" fill="#0c4a6e">VERIFYING</text>
    <rect x="830" y="66" width="126" height="44" rx="22" fill="#dcfce7" stroke="#15803d"/><text x="893" y="93" text-anchor="middle" fill="#14532d">COMPLETED</text>
  </g>
  <line x1="144" y1="88" x2="196" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="390" y1="88" x2="446" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="580" y1="88" x2="636" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="770" y1="88" x2="826" y2="88" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="400" y="80" fill="#475569" font-size="11">decision</text>

  <!-- step boxes -->
  <rect x="24" y="140" width="290" height="150" rx="10" fill="#fff7ed" stroke="#c2410c"/>
  <text x="40" y="164" font-weight="600" fill="#7c2d12">A · Gateway creates the approval</text>
  <text x="40" y="186" fill="#334155">• reads the live purchase request</text>
  <text x="40" y="204" fill="#334155">• blocks if amount / currency / vendor /</text>
  <text x="52" y="220" fill="#334155">version don't match the request</text>
  <text x="40" y="240" fill="#334155">• stores SHA-256 of exact params + snapshot</text>
  <text x="40" y="258" fill="#334155">• TTL (APPROVAL_TTL_MINUTES, default 30)</text>
  <text x="40" y="276" fill="#334155">• run checkpoint saves the pending call</text>

  <rect x="340" y="140" width="290" height="150" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="356" y="164" font-weight="600" fill="#0f172a">B · Human decides (console / API)</text>
  <text x="356" y="186" fill="#334155">• card: action, justification, project,</text>
  <text x="368" y="202" fill="#334155">amount + currency, recipient, risks, policy</text>
  <text x="356" y="222" fill="#334155">• POST /api/approvals/{id}/decision</text>
  <text x="368" y="238" fill="#334155">needs X-Approver-Key; agent names refused</text>
  <text x="356" y="258" fill="#334155">• silence / timeout ≠ approval (→ EXPIRED)</text>
  <text x="356" y="276" fill="#334155">• one decision only (compare-and-set)</text>

  <rect x="656" y="140" width="300" height="150" rx="10" fill="#eef2ff" stroke="#4338ca"/>
  <text x="672" y="164" font-weight="600" fill="#312e81">C · Resume at the execution boundary</text>
  <text x="672" y="186" fill="#334155">• reload brain from checkpoint</text>
  <text x="672" y="204" fill="#334155">• re-read record: version, amount, currency,</text>
  <text x="684" y="220" fill="#334155">vendor, status unchanged? budget enough?</text>
  <text x="672" y="240" fill="#334155">• policy re-evaluated (hard limit, method)</text>
  <text x="672" y="258" fill="#334155">• idempotency key → executes exactly once</text>
  <text x="672" y="276" fill="#334155">• approval → CONSUMED</text>

  <line x1="314" y1="215" x2="336" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <line x1="630" y1="215" x2="652" y2="215" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- outcomes -->
  <text x="24" y="330" font-size="15" font-weight="600" fill="#0f172a">Outcomes — the controlled action never runs without a valid, unchanged, explicit approval</text>
  <rect x="24" y="346" width="225" height="92" rx="8" fill="#dcfce7" stroke="#15803d"/>
  <text x="40" y="370" font-weight="600" fill="#14532d">APPROVED + valid</text>
  <text x="40" y="390" fill="#334155">simulated payment executes;</text>
  <text x="40" y="408" fill="#334155">agent verifies PR = Paid</text>
  <text x="40" y="426" fill="#334155">→ COMPLETED</text>

  <rect x="265" y="346" width="225" height="92" rx="8" fill="#fee2e2" stroke="#b91c1c"/>
  <text x="281" y="370" font-weight="600" fill="#7f1d1d">REJECTED</text>
  <text x="281" y="390" fill="#334155">payment not executed; agent</text>
  <text x="281" y="408" fill="#334155">verifies PR still unpaid</text>
  <text x="281" y="426" fill="#334155">→ REJECTED (decision recorded)</text>

  <rect x="506" y="346" width="225" height="92" rx="8" fill="#fef9c3" stroke="#a16207"/>
  <text x="522" y="370" font-weight="600" fill="#713f12">EXPIRED / INVALIDATED</text>
  <text x="522" y="390" fill="#334155">TTL passed or record changed</text>
  <text x="522" y="408" fill="#334155">after approval → not executed,</text>
  <text x="522" y="426" fill="#334155">explained in the timeline</text>

  <rect x="747" y="346" width="209" height="92" rx="8" fill="#f1f5f9" stroke="#475569"/>
  <text x="763" y="370" font-weight="600" fill="#0f172a">Restart mid-payment</text>
  <text x="763" y="390" fill="#334155">ledger row STARTED → marked</text>
  <text x="763" y="408" fill="#334155">UNCERTAIN; run → BLOCKED,</text>
  <text x="763" y="426" fill="#334155">never auto-retried</text>

  <rect x="24" y="462" width="932" height="56" rx="8" fill="#ecfeff" stroke="#0e7490"/>
  <text x="490" y="485" text-anchor="middle" fill="#164e63" font-weight="600">Restart recovery: on backend start, active runs resume from their last SQLite checkpoint;</text>
  <text x="490" y="505" text-anchor="middle" fill="#164e63">pending approvals survive restarts, and a decision recorded before a restart is resumed afterwards.</text>
</svg>
